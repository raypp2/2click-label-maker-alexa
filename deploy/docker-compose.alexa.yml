  # Alexa skill: its own Tailscale node (tag:alexa) publishes only /alexa via Funnel.
  # The skill container shares this node's network, so Funnel reaches it on
  # 127.0.0.1:3000 and it reaches the label maker as http://ui:8000.
  ts-alexa:
    image: tailscale/tailscale:latest
    container_name: labelmaker-ts-alexa
    hostname: labelmaker-alexa
    restart: always
    env_file:
      - ./alexa/.env
    environment:
      - TS_HOSTNAME=labelmaker-alexa
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_EXTRA_ARGS=--advertise-tags=tag:alexa
    cap_add:
      - NET_ADMIN
    entrypoint: ["/alexa/firewall.sh"]
    volumes:
      - ./alexa/ts-state:/var/lib/tailscale
      - ./alexa/serve.json:/config/serve.json:ro
      - ./alexa/firewall.sh:/alexa/firewall.sh:ro

  alexa:
    build: ./alexa/app
    container_name: labelmaker-alexa
    restart: always
    network_mode: service:ts-alexa
    depends_on:
      - ts-alexa
      - ui
    environment:
      - SKILL_ID=${SKILL_ID}
      - LABEL_MAKER_URL=http://ui:8000
      - DEFAULT_TZ=America/New_York
      # 1 = log print jobs instead of printing (first live tests); 0 = print for real
      - DRY_RUN=0
